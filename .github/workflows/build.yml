name: Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ABI_NAMES: arm64-v8a armeabi-v7a x86_64

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Deps
      run: sudo apt install ninja-build

    - name: Native Build
      run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME ./build-shared-libs.sh

    - name: App Build
      run: |
        cd project
        "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore keystore.jks \
          -alias r01 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass r01store -keypass r01key -dname "CN=Rance01 Port"
        JAVA_HOME=$JAVA_HOME_17_X64 ./gradlew assembleRelease
      env:
        KEY_ALIAS: r01
        KEY_PASSWORD: r01key
        KEYSTORE_PASSWORD: r01store

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        path: project/app/build/outputs/apk/release/app-release.apk
        archive: false
