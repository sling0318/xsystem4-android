name: iOS simulator smoke test

on:
  push:
    branches: [ios-spike]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v6

    - name: Install build tools
      run: brew install ninja flex bison gawk

    - name: Prepend keg-only flex/bison
      run: |
        echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

    - name: List available simulators
      run: xcrun simctl list devices available | head -40

    - name: Run simulator smoke test
      run: bash ios/sim/run-sim-smoke.sh

    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ios-sim-smoke
        path: |
          build-ios-sim/smoke.log
          build-ios-sim/smoke.png
